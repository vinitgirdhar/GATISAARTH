name: gatisaarth
description: "GatiSaarth - High-Precision Vehicle Navigation System using Dead Reckoning, Multi-GNSS/NavIC, and Edge AI"
publish_to: 'none'
version: 4.5.0+47

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  ffi: ^2.1.3
  http: ^1.6.0
  flutter_map: ^7.0.2
  sensors_plus: ^6.1.1
  tflite_flutter: ^0.12.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.3
  latlong2: ^0.9.1
  path_provider: ^2.1.0
  # Already resolved transitively (via share_plus et al.); declared directly so
  # the benchmark report exporter can hash its canonical JSON payload.
  crypto: ^3.0.7
  # Bundled with Flutter already (transitive); declared so the navigation core
  # can use its Quaternion/Matrix3 instead of hand-rolled rotation maths.
  vector_math: ^2.4.0
  share_plus: ^13.3.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  image: ^4.3.0
  # Bounded concurrent reads of the offline map archives (already a transitive
  # dependency of `pmtiles`).
  pool: ^1.5.1
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  pmtiles: ^1.3.0
  # Decodes the `roads` layer of the installed map archives into a road graph
  # (already a transitive dependency of `vector_map_tiles`).
  vector_tile: ^2.0.1

  vector_tile_renderer: any
  pdf: ^3.12.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter_native_splash:
  color: "#050A14"
  color_dark: "#050A14"
  android_12:
    color: "#050A14"
    color_dark: "#050A14"
    icon_background_color: "#050A14"
    icon_background_color_dark: "#050A14"

flutter:
  uses-material-design: true
  assets:
    # Listed file by file: only what the app loads ships in the APK.
    - assets/models/model_metadata.json
    - assets/models/speed_estimator.tflite
    - assets/benchmarks/
    - assets/maps/packs/
    - assets/icons/logo.png
    - assets/icons/logo_mark.png
    - assets/icons/splash_icon.png
    - assets/icons/wordmark.png
    - assets/icons/wordmark_dark.png
    - assets/images/
    - assets/config/portal_anchors.json
  fonts:
    - family: .SF Pro Text
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    # Some text styles name the family directly.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
