name: gatisaarth
description: "GatiSaarth - High-Precision Vehicle Navigation System using Dead Reckoning, Multi-GNSS/NavIC, and Edge AI"
publish_to: 'none'
version: 4.2.0+42

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  ffi: ^2.1.3
  http: ^1.6.0
  flutter_map: ^7.0.2
  sensors_plus: ^6.1.1
  tflite_flutter: ^0.12.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.3
  latlong2: ^0.9.1
  path_provider: ^2.1.0
  # Bundled with Flutter already (transitive); declared so the navigation core
  # can use its Quaternion/Matrix3 instead of hand-rolled rotation maths.
  vector_math: ^2.4.0
  share_plus: ^13.3.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  image: ^4.3.0
  # Bounded concurrent reads of the offline map archives (already a transitive
  # dependency of `pmtiles`).
  pool: ^1.5.1
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  pmtiles: ^1.3.0
  # Decodes the `roads` layer of the installed map archives into a road graph
  # (already a transitive dependency of `vector_map_tiles`).
  vector_tile: ^2.0.1

  vector_tile_renderer: any
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter_native_splash:
  color: "#050A14"
  color_dark: "#050A14"
  android_12:
    color: "#050A14"
    color_dark: "#050A14"
    icon_background_color: "#050A14"
    icon_background_color_dark: "#050A14"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/benchmarks/
    - assets/maps/
    - assets/maps/packs/
    - assets/maps/tiles/
    - assets/maps/tiles/11/1462/
    - assets/maps/tiles/11/1463/
    - assets/maps/tiles/12/2924/
    - assets/maps/tiles/12/2925/
    - assets/maps/tiles/12/2926/
    - assets/maps/tiles/13/5848/
    - assets/maps/tiles/13/5849/
    - assets/maps/tiles/13/5850/
    - assets/maps/tiles/13/5851/
    - assets/maps/tiles/13/5852/
    - assets/maps/tiles/13/5853/
    - assets/maps/tiles/14/11697/
    - assets/maps/tiles/14/11698/
    - assets/maps/tiles/14/11699/
    - assets/maps/tiles/14/11700/
    - assets/maps/tiles/14/11701/
    - assets/maps/tiles/14/11702/
    - assets/maps/tiles/14/11703/
    - assets/maps/tiles/14/11704/
    - assets/maps/tiles/14/11705/
    - assets/maps/tiles/14/11706/
