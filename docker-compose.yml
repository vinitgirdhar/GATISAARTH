services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      GATI_DATABASE_URL: postgresql+asyncpg://gati:gati@db:5432/gati
      GATI_REDIS_URL: redis://redis:6379/
      GATI_JWT_SECRET: ${GATI_JWT_SECRET:-devsecret_gatisaarth_key_2026}
      GATI_JWT_ALGORITHM: HS256
      GATI_S3_ENDPOINT_URL: http://minio:9000
      GATI_S3_BUCKET: idr-models
      GATI_S3_ACCESS_KEY: minioadmin
      GATI_S3_SECRET_KEY: minioadmin
    depends_on:
      - db
      - redis
      - minio

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gati
      POSTGRES_USER: gati
      POSTGRES_PASSWORD: gati
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
